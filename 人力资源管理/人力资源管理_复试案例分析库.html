<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人力资源管理复试案例分析库 | 中南大学企业管理学硕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f5f3ee;
    --bg2: #eeeae0;
    --card: #ffffff;
    --card-border: #e0dbd0;
    --text: #1a1814;
    --text-muted: #6b6560;
    --accent: #b5451b;
    --accent2: #2563a8;
    --accent3: #1a7a4a;
    --accent4: #7c3aad;
    --accent5: #c27d10;
    --tag-bg: #f0ece3;
    --header-bg: #1a1814;
    --header-text: #f5f3ee;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 12px;
    --font-serif: 'Noto Serif SC', 'SimSun', serif;
    --font-sans: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }

  body.dark {
    --bg: #111010;
    --bg2: #1a1918;
    --card: #222120;
    --card-border: #333230;
    --text: #f0ece4;
    --text-muted: #9a9590;
    --tag-bg: #2a2826;
    --header-bg: #0a0908;
    --header-text: #f0ece4;
    --shadow: 0 2px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.7;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 28px 40px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
  }

  .header-left h1 {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--header-text);
  }

  .header-left .subtitle {
    font-size: 0.78rem;
    color: #a09880;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .header-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-icon {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--header-text);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background 0.2s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.2); }

  /* ===== SEARCH BAR ===== */
  .search-bar-wrap {
    background: var(--bg2);
    padding: 18px 40px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  #searchInput {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    border: 1.5px solid var(--card-border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput:focus { border-color: var(--accent2); }

  .filter-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--card-border);
    background: var(--card);
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  #searchCount {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ===== MAIN ===== */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }

  /* ===== STATS BANNER ===== */
  .stats-banner {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .num {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-card .label { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }
  .stat-card:nth-child(1) .num { color: var(--accent); }
  .stat-card:nth-child(2) .num { color: var(--accent2); }
  .stat-card:nth-child(3) .num { color: var(--accent3); }
  .stat-card:nth-child(4) .num { color: var(--accent4); }

  /* ===== SECTION HEADER ===== */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--card-border);
  }
  .section-header h2 {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    color: var(--text);
  }
  .section-header .count-badge {
    background: var(--accent);
    color: #fff;
    font-size: 0.72rem;
    padding: 2px 10px;
    border-radius: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* ===== TABLE ===== */
  .table-wrap {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    overflow-x: auto;
    margin-bottom: 48px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead tr {
    background: var(--header-bg);
    color: var(--header-text);
  }
  thead th {
    padding: 14px 16px;
    text-align: left;
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  thead th:first-child { border-radius: var(--radius) 0 0 0; }
  thead th:last-child { border-radius: 0 var(--radius) 0 0; }

  tbody tr {
    border-bottom: 1px solid var(--card-border);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--tag-bg); }
  tbody tr.hidden { display: none; }

  td {
    padding: 14px 16px;
    vertical-align: top;
  }

  /* ===== COMPANY CELL ===== */
  .company-cell {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .company-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    font-weight: 700;
  }
  .company-name {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.3;
  }
  .company-type {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ===== INDUSTRY BADGE ===== */
  .industry-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .ind-tech { background: #e8f0fe; color: #1a4aad; }
  .ind-mfg { background: #e8f5e9; color: #1a7a4a; }
  .ind-retail { background: #fff3e0; color: #c27d10; }
  .ind-internet { background: #fce4ec; color: #b5451b; }
  .ind-finance { background: #ede7f6; color: #7c3aad; }
  .ind-energy { background: #e0f7fa; color: #007c91; }
  .ind-fmcg { background: #fff8e1; color: #a06010; }
  .ind-logistics { background: #e8eaf6; color: #3949ab; }
  .ind-media { background: #fdf6ff; color: #8e24aa; }
  .ind-estate { background: #f3e5f5; color: #9c27b0; }
  .ind-auto { background: #e3f2fd; color: #1565c0; }
  .ind-food { background: #fff9f0; color: #e65100; }
  body.dark .ind-tech { background: #1a2a4a; color: #7ab0ff; }
  body.dark .ind-mfg { background: #1a2e22; color: #6ecf90; }
  body.dark .ind-retail { background: #2e2010; color: #ffb74d; }
  body.dark .ind-internet { background: #2e1a14; color: #ff8a65; }
  body.dark .ind-finance { background: #1e1a2e; color: #ce93d8; }
  body.dark .ind-energy { background: #0a2428; color: #4dd0e1; }
  body.dark .ind-fmcg { background: #2e2814; color: #ffcc80; }
  body.dark .ind-logistics { background: #1a1c36; color: #9fa8da; }
  body.dark .ind-media { background: #281a2e; color: #e040fb; }
  body.dark .ind-estate { background: #2a1a2e; color: #ce93d8; }
  body.dark .ind-auto { background: #0e1e36; color: #64b5f6; }
  body.dark .ind-food { background: #2e1e0a; color: #ffab40; }

  /* ===== KP TAGS ===== */
  .kp-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .kp-tag {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 6px;
    font-size: 0.72rem;
    background: var(--tag-bg);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
    white-space: nowrap;
  }
  .kp-tag.hot {
    background: #fff0ec;
    color: var(--accent);
    border-color: #f5c5b5;
  }
  body.dark .kp-tag.hot { background: #2e1a14; border-color: #5a2a18; }

  /* ===== CASE DESC ===== */
  .case-desc {
    color: var(--text);
    font-size: 0.85rem;
    line-height: 1.65;
    max-width: 480px;
  }

  /* ===== CARDS SECTION ===== */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    margin-bottom: 48px;
  }

  .case-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
    display: flex;
    flex-direction: column;
  }
  .case-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
  }
  .case-card.hidden { display: none; }

  .card-header {
    padding: 16px 18px 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border-bottom: 1px solid var(--card-border);
  }

  .card-num {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .card-title-area { flex: 1; }
  .card-company {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
    font-family: var(--font-serif);
  }
  .card-meta {
    display: flex;
    gap: 8px;
    margin-top: 5px;
    flex-wrap: wrap;
    align-items: center;
  }

  .card-body { padding: 14px 18px; flex: 1; }
  .card-kps { margin-bottom: 10px; }
  .card-kp-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-desc {
    font-size: 0.85rem;
    line-height: 1.65;
    color: var(--text);
  }

  /* ===== KP SUMMARY SECTION ===== */
  .kp-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }

  .kp-summary-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kp-summary-card h4 {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kp-summary-card h4 span {
    font-size: 0.7rem;
    background: var(--accent);
    color: #fff;
    padding: 1px 8px;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .kp-case-list {
    list-style: none;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .kp-case-list li { padding: 2px 0; }
  .kp-case-list li::before { content: "• "; color: var(--accent); }

  /* ===== FOOTER ===== */
  footer {
    background: var(--header-bg);
    color: #888;
    text-align: center;
    padding: 20px;
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
  }

  /* ===== BACK TO TOP ===== */
  #backTop {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 44px;
    height: 44px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.3s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
  }
  #backTop.visible { opacity: 1; pointer-events: auto; }
  #backTop:hover { transform: scale(1.1); }

  /* ===== HIGHLIGHT ===== */
  mark {
    background: #ffe066;
    color: #1a1814;
    padding: 1px 2px;
    border-radius: 3px;
  }
  body.dark mark { background: #7a6000; color: #fff3b0; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    header { padding: 16px 20px; flex-wrap: wrap; gap: 10px; }
    .search-bar-wrap { padding: 14px 20px; }
    main { padding: 20px 16px 60px; }
    .stats-banner { grid-template-columns: repeat(2, 1fr); }
    .cards-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .header-left h1 { font-size: 1.1rem; }
    table { font-size: 0.78rem; }
    td { padding: 10px 10px; }
  }
</style>

<style>
/* ═══ 悬浮搜索药丸 v3 ═══ */
#search-trigger{position:fixed;bottom:80px;right:22px;z-index:9998;width:44px;height:44px;
  border-radius:50%;background:#1e293b;color:#f8fafc;border:2px solid #334155;font-size:18px;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:background .2s,transform .15s;
  display:flex;align-items:center;justify-content:center;}
#search-trigger:hover{background:#334155;transform:scale(1.08);}
#search-pill{position:fixed;bottom:80px;right:18px;z-index:9999;display:flex;align-items:center;
  gap:6px;background:#1e293b;color:#f8fafc;border:1.5px solid #475569;border-radius:50px;
  padding:8px 14px 8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:14px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-width:300px;max-width:420px;}
#sp-icon{font-size:16px;flex-shrink:0;}
#sp-input{flex:1;background:transparent;border:none;outline:none;color:#f8fafc;
  font-size:14px;font-family:inherit;min-width:0;}
#sp-input::placeholder{color:rgba(248,250,252,.4);}
#sp-count{color:#94a3b8;font-size:12px;white-space:nowrap;flex-shrink:0;
  font-variant-numeric:tabular-nums;min-width:60px;text-align:center;}
#search-pill button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#f8fafc;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s;}
#search-pill button:hover{background:rgba(255,255,255,.25);}
#sp-close{font-size:12px;}
mark.sp-hl{background:#fbbf24;color:#000;border-radius:2px;padding:0 1px;}
mark.sp-hl.sp-cur{background:#f97316;color:#fff;outline:2px solid #fb923c;}
body.dark-mode #search-trigger{background:#0f172a;border-color:#334155;}
body.dark-mode #search-pill{background:#0f172a;border-color:#334155;}
/* iframe内缩小以免被遮 */
body.in-iframe #search-trigger{bottom:20px;right:12px;width:36px;height:36px;font-size:15px;}
body.in-iframe #search-pill{bottom:20px;right:8px;min-width:260px;max-width:360px;font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📚 人力资源管理 · 复试案例分析库</h1>
    <div class="subtitle">中南大学企业管理学硕 | 颜爱民《人力资源管理》第三版 | 生成日期：2026-03-09 | 共 30 个真实企业案例</div>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="toggleView()" id="viewBtn">🃏 卡片视图</button>
    <button class="btn-icon" onclick="toggleDark()" id="darkBtn">🌙 夜间模式</button>
  </div>
</header>

<div class="search-bar-wrap">
  
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">全部</button>
  <button class="filter-btn" data-filter="招聘" onclick="setFilter('招聘', this)">招聘</button>
  <button class="filter-btn" data-filter="培训" onclick="setFilter('培训', this)">培训</button>
  <button class="filter-btn" data-filter="绩效" onclick="setFilter('绩效', this)">绩效</button>
  <button class="filter-btn" data-filter="薪酬" onclick="setFilter('薪酬', this)">薪酬</button>
  <button class="filter-btn" data-filter="激励" onclick="setFilter('激励', this)">激励</button>
  <button class="filter-btn" data-filter="职业" onclick="setFilter('职业', this)">职业发展</button>
  <button class="filter-btn" data-filter="文化" onclick="setFilter('文化', this)">企业文化</button>
  <span id="searchCount">显示 30 / 30 个案例</span>
</div>

<main>
  <!-- Stats Banner -->
  <div class="stats-banner">
    <div class="stat-card"><div class="num">30</div><div class="label">真实企业案例</div></div>
    <div class="stat-card"><div class="num">22</div><div class="label">中国本土企业</div></div>
    <div class="stat-card"><div class="num">12</div><div class="label">覆盖知识点</div></div>
    <div class="stat-card"><div class="num">15</div><div class="label">覆盖行业</div></div>
  </div>

  <!-- Table View (default) -->
  <div id="tableView">
    <div class="section-header">
      <h2>📊 案例总览表</h2>
      <span class="count-badge" id="tableCount">30 个案例</span>
    </div>
    <div class="table-wrap">
      <table id="caseTable">
        <thead>
          <tr>
            <th style="width:36px;">#</th>
            <th style="width:160px;">企业</th>
            <th style="width:100px;">行业</th>
            <th style="width:220px;">可对应知识点</th>
            <th>案例说明</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>

  <!-- Card View (hidden by default) -->
  <div id="cardView" style="display:none;">
    <div class="section-header">
      <h2>🃏 案例卡片</h2>
      <span class="count-badge" id="cardCount">30 个案例</span>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- KP Summary -->
  <div class="section-header">
    <h2>🗂️ 知识点 → 案例速查</h2>
    <span class="count-badge">12 个知识点</span>
  </div>
  <div class="kp-summary-grid" id="kpSummaryGrid"></div>

</main>

<footer>
  人力资源管理复试案例分析库 · 中南大学企业管理学硕 · 生成日期：2026-03-09
</footer>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ===== DATA =====
const cases = [
  {
    id: 1,
    company: "华为",
    type: "国企/民企", icon: "🔷", iconBg: "#1a4aad",
    industry: "科技/通信", indClass: "ind-tech",

function renderKPSummary() {
  const grid = document.getElementById("kpSummaryGrid");
  grid.innerHTML = "";
  mainKPs.forEach(mk => {
    let matchedCases = new Set();
    cases.forEach(c => {
      const allKpText = c.kps.join(" ");
      const match = mk.keys.some(k => {
        if (kpCategories[k]) {
          return kpCategories[k].some(kk => allKpText.includes(kk));
        }
        return allKpText.includes(k);
      });
      if (match) matchedCases.add(c.company);
    });
    if (matchedCases.size === 0) return;
    const card = document.createElement("div");
    card.className = "kp-summary-card";
    const caseList = [...matchedCases].slice(0, 8).map(n => `<li>${n}</li>`).join("");
    const moreCount = matchedCases.size > 8 ? `…等${matchedCases.size}家` : "";
    card.innerHTML = `
      <h4>📌 ${mk.name} <span>${matchedCases.size} 个案例</span></h4>
      <ul class="kp-case-list">${caseList}${moreCount ? `<li style="color:var(--text-muted)">${moreCount}</li>` : ""}</ul>
    `;
    grid.appendChild(card);
  });
}

// ===== FILTER & SEARCH =====
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}


function applyFilters() {
  const rows = document.querySelectorAll("#tableBody tr");
  const cards = document.querySelectorAll(".case-card");
  let count = 0;

  const allEls = currentView === "table" ? rows : cards;
  allEls.forEach(el => {
    const searchStr = (el.dataset.company + el.dataset.industry + el.dataset.kps + el.dataset.desc).toLowerCase();
    const matchSearch = !currentSearch || searchStr.includes(currentSearch);
    let matchFilter = true;
    if (currentFilter !== "all") {
      const filterKPs = kpCategories[currentFilter] || [];
      matchFilter = filterKPs.some(kp => el.dataset.kps.includes(kp));
    }
    if (matchSearch && matchFilter) {
      el.classList.remove("hidden");
      count++;
      // highlight
      if (currentSearch) {
        el.querySelectorAll(".case-desc,.card-desc").forEach(d => {
          d.innerHTML = d.textContent.replace(
            new RegExp(currentSearch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
            m => `<mark>${m}</mark>`
          );
        });
      } else {
        el.querySelectorAll(".case-desc,.card-desc").forEach(d => {
          d.innerHTML = d.textContent;
        });
      }
    } else {
      el.classList.add("hidden");
    }
  });

  document.getElementById("searchCount").textContent = `显示 ${count} / ${cases.length} 个案例`;
  if (currentView === "table") document.getElementById("tableCount").textContent = `${count} 个案例`;
  else document.getElementById("cardCount").textContent = `${count} 个案例`;
}

// ===== VIEW TOGGLE =====
function toggleView() {
  const btn = document.getElementById("viewBtn");
  if (currentView === "table") {
    currentView = "card";
    document.getElementById("tableView").style.display = "none";
    document.getElementById("cardView").style.display = "block";
    btn.textContent = "📊 表格视图";
  } else {
    currentView = "table";
    document.getElementById("tableView").style.display = "block";
    document.getElementById("cardView").style.display = "none";
    btn.textContent = "🃏 卡片视图";
  }
  applyFilters();
}

// ===== DARK MODE =====
function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.getElementById("darkBtn");
  btn.textContent = document.body.classList.contains("dark") ? "☀️ 日间模式" : "🌙 夜间模式";
  localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "1" : "0");
}

// ===== BACK TO TOP =====
window.addEventListener("scroll", () => {
  const btn = document.getElementById("backTop");
  if (window.scrollY > 300) btn.classList.add("visible");
  else btn.classList.remove("visible");
});

// ===== INIT =====
window.onload = () => {
  renderTable();
  renderCards();
  renderKPSummary();
  applyFilters();
  if (localStorage.getItem("darkMode") === "1") {
    document.body.classList.add("dark");
    document.getElementById("darkBtn").textContent = "☀️ 日间模式";
  }
};

<script>
(function(){

  var style=document.createElement('style');
  style.textContent=
    'mark.hl{background:#fef08a;color:#713f12;border-radius:3px;padding:0 2px;font-weight:700}'
   +'mark.hl.cur{background:#fb923c!important;color:#fff!important;outline:2px solid #f97316}'
   +'#hl-nav{position:fixed;bottom:22px;right:22px;z-index:9999;background:#1a2340;color:#e8ecf4;border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;padding:7px 10px 7px 15px;font-size:13px;font-family:Microsoft YaHei,PingFang SC,sans-serif;font-variant-numeric:tabular-nums;user-select:none}'
   +'#hl-nav .hl-kw{color:#60a5fa;font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
   +'#hl-nav .hl-cnt{color:#93c5fd;min-width:42px;text-align:center;font-weight:700}'
   +'#hl-nav button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}'
   +'#hl-nav button:hover{background:rgba(255,255,255,.28)}'
   +'#hl-nav .hl-x{background:rgba(220,38,38,.25)!important;color:#fca5a5!important;font-size:12px}'
   +'#hl-nav .hl-x:hover{background:rgba(220,38,38,.55)!important;color:#fff!important}';
  document.head.appendChild(style);
  function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  var terms=kw.split(/\s+/).filter(Boolean);
  var pat=new RegExp('('+terms.map(escRe).join('|')+')','gi');
  var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  var nodes=[];var nd;
  while((nd=walker.nextNode())){
    var p=nd.parentElement;if(!p)continue;
    var tg=p.tagName;
    if(tg==='SCRIPT'||tg==='STYLE'||tg==='NOSCRIPT')continue;
    if(p.id==='hl-nav'||(p.closest&&p.closest('#hl-nav')))continue;
    if(pat.test(nd.textContent))nodes.push(nd);pat.lastIndex=0;
  }
  var marks=[];
  nodes.forEach(function(node){
    var parts=node.textContent.split(pat);if(parts.length<=1)return;
    var frag=document.createDocumentFragment();
    parts.forEach(function(part){
      pat.lastIndex=0;
      if(pat.test(part)){var m=document.createElement('mark');m.className='hl';m.textContent=part;marks.push(m);frag.appendChild(m);}
      else frag.appendChild(document.createTextNode(part));
      pat.lastIndex=0;
    });
    node.parentNode.replaceChild(frag,node);
  });
  if(!marks.length)return;
  var cur=0;
  var nav=document.createElement('div');nav.id='hl-nav';
  function go(d){
    marks[cur].classList.remove('cur');
    cur=(cur+d+marks.length)%marks.length;
    marks[cur].classList.add('cur');
    marks[cur].scrollIntoView({behavior:'smooth',block:'center'});
    nav.querySelector('.hl-cnt').textContent=(cur+1)+' / '+marks.length;
  }
  function clear(){nav.remove();marks.forEach(function(m){m.parentNode&&m.parentNode.replaceChild(document.createTextNode(m.textContent),m);});}
  nav.innerHTML='<span style="font-size:14px">&#128269;</span>'
    +'<span class="hl-kw"></span>'
    +'<span class="hl-cnt">1 / '+marks.length+'</span>'
    +'<button id="hlPrev" title="上一个 (Shift+F3)">↑</button>'
    +'<button id="hlNext" title="下一个 (F3)">↓</button>'
    +'<button class="hl-x" id="hlClose" title="关闭">✕</button>';
  nav.querySelector('.hl-kw').textContent=kw;
  nav.querySelector('#hlPrev').onclick=function(){go(-1);};
  nav.querySelector('#hlNext').onclick=function(){go(1);};
  nav.querySelector('#hlClose').onclick=clear;
  document.body.appendChild(nav);
  marks[cur].classList.add('cur');
  setTimeout(function(){marks[cur].scrollIntoView({behavior:'smooth',block:'center'});},250);
  document.addEventListener('keydown',function(e){if(e.key==='F3'){e.preventDefault();go(e.shiftKey?-1:1);}});
})();
</script>

    }
    if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();open();}
  },true); /* capture phase to override HL_INJECT listener */
}

window.openSearchPill=open;
function open(){
  if(!pill)init();if(!pill)return;
  pill.style.display='flex';
  if(trigger)trigger.style.display='none';
  inp.focus();inp.select();
}
function close(){
  clearHL();
  if(pill)pill.style.display='none';
  if(trigger)trigger.style.display='flex';
  if(inp)inp.value='';
  marks=[];cur=0;lastQ='';
  if(cnt)cnt.textContent='';
}

function search(q){
  clearHL();marks=[];cur=0;
  q=q.trim();lastQ=q;
  if(!q){if(cnt)cnt.textContent='';return;}
  var esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var rx=new RegExp(esc,'gi');
  /* find best root */
  var root=document.querySelector(
    '.main-container,.main,.content-area,main,#main,.content,article'
  )||document.body;
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode:function(n){
      var p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;
      var t=p.tagName;
      if(t==='SCRIPT'||t==='STYLE'||t==='NOSCRIPT')return NodeFilter.FILTER_REJECT;
      /* skip pill and trigger */
      if(p.id==='search-pill'||p.id==='search-trigger')return NodeFilter.FILTER_REJECT;
      if(p.closest&&(p.closest('#search-pill')||p.closest('#search-trigger')))
        return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  },false);
  var nodes=[];var n;
  while((n=walker.nextNode())){rx.lastIndex=0;if(rx.test(n.nodeValue))nodes.push(n);}
  nodes.forEach(function(tn){
    rx.lastIndex=0;
    var frag=document.createDocumentFragment();
    var last=0,m;
    while((m=rx.exec(tn.nodeValue))!==null){
      if(m.index>last)frag.appendChild(document.createTextNode(tn.nodeValue.slice(last,m.index)));
      var mk=document.createElement('mark');mk.className=MARK;mk.textContent=m[0];
      frag.appendChild(mk);marks.push(mk);last=m.index+m[0].length;
    }
    if(last<tn.nodeValue.length)frag.appendChild(document.createTextNode(tn.nodeValue.slice(last)));
    tn.parentNode.replaceChild(frag,tn);
  });
  updCnt();
  if(marks.length)goTo(0);
}

function nav(d){
  /* always re-read from DOM in case DOM changed */
  marks=qa('mark.'+MARK);
  if(!marks.length)return;
  cur=(cur+d+marks.length)%marks.length;
  goTo(cur);
}
function goTo(idx){
  marks=qa('mark.'+MARK);
  marks.forEach(function(m){m.classList.remove(CUR);});
  cur=idx;
  if(!marks[cur])return;
  marks[cur].classList.add(CUR);
  marks[cur].scrollIntoView({behavior:'smooth',block:'center'});
  updCnt();
}
function updCnt(){
  if(!cnt)return;
  marks=qa('mark.'+MARK);
  if(!lastQ){cnt.textContent='';return;}
  if(!marks.length){cnt.textContent='无结果';return;}
  var kw=lastQ.length>6?lastQ.slice(0,5)+'…':lastQ;
  cnt.textContent=kw+'\u00a0\u00a0'+(cur+1)+' / '+marks.length;
}
function clearHL(){
  qa('mark.'+MARK).forEach(function(el){
    if(el.parentNode)el.parentNode.replaceChild(document.createTextNode(el.textContent),el);
  });
  try{(document.querySelector('.main-container,.main,main,#main,article,.content')||document.body).normalize();}catch(e){}
  marks=[];
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
